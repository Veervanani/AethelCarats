<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#1f1f1f" stroke-width="2.5"/>
  <!-- Inner Octagon (Table Tier) -->
  <polygon points="66,50 61.3,61.3 50,66 38.7,61.3 34,50 38.7,38.7 50,34 61.3,38.7" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  <!-- Middle Octagon (Crown Tier) -->
  <polygon points="80,50 71.2,71.2 50,80 28.8,71.2 20,50 28.8,28.8 50,20 71.2,28.8" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  <!-- Radial lines connecting tiers -->
  <line x1="50" y1="34" x2="50" y2="20" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="61.3" y1="38.7" x2="71.2" y2="28.8" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="66" y1="50" x2="80" y2="50" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="61.3" y1="61.3" x2="71.2" y2="71.2" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="50" y1="66" x2="50" y2="80" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="38.7" y1="61.3" x2="28.8" y2="71.2" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="34" y1="50" x2="20" y2="50" stroke="#1f1f1f" stroke-width="1.2"/>
  <line x1="38.7" y1="38.7" x2="28.8" y2="28.8" stroke="#1f1f1f" stroke-width="1.2"/>
  <!-- Outer girdle connectors to circle -->
  <line x1="50" y1="20" x2="50" y2="8" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="71.2" y1="28.8" x2="79.7" y2="20.3" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="92" y2="50" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="71.2" y1="71.2" x2="79.7" y2="79.7" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="50" y2="92" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="28.8" y1="71.2" x2="20.3" y2="79.7" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="20" y1="50" x2="8" y2="50" stroke="#1f1f1f" stroke-width="1.5"/>
  <line x1="28.8" y1="28.8" x2="20.3" y2="20.3" stroke="#1f1f1f" stroke-width="1.5"/>
  <!-- Diagonal criss-cross facets -->
  <line x1="66" y1="50" x2="71.2" y2="28.8" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="66" y1="50" x2="71.2" y2="71.2" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="50" y1="66" x2="71.2" y2="71.2" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="50" y1="66" x2="28.8" y2="71.2" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="34" y1="50" x2="28.8" y2="71.2" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="34" y1="50" x2="28.8" y2="28.8" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="50" y1="34" x2="28.8" y2="28.8" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="50" y1="34" x2="71.2" y2="28.8" stroke="#1f1f1f" stroke-width="1"/>
</svg>